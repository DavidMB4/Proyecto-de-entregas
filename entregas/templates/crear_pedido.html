<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Pedido - Empresa de Entregas</title>
    <!-- Tailwind CSS CDN para renderizado inmediato -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f7f1e3] min-h-screen flex items-center justify-center p-6">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-8 border-[#cd5c5c]">
        <!-- Encabezado -->
        <div class="flex items-center justify-center mb-6 space-x-2">
            <span class="text-3xl">📦</span>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">LOGÍSTICA DE ENTREGAS</h1>
        </div>

        <h2 class="text-lg font-bold text-gray-700 mb-6 text-center border-b pb-3">Registrar Nuevo Pedido</h2>

        <form action="/pedidos/" method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label for="origen" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Origen:</label>
                <input type="text" id="origen" name="origen" required 
                       placeholder="Ej. Monterrey"
                       class="w-full rounded-lg border-gray-300 shadow-sm border p-3 focus:ring-2 focus:ring-stone-400 focus:border-stone-400 outline-none text-gray-900">
            </div>

            <div>
                <label for="destino" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Destino:</label>
                <input type="text" id="destino" name="destino" required 
                       placeholder="Ej. Guadalajara"
                       class="w-full rounded-lg border-gray-300 shadow-sm border p-3 focus:ring-2 focus:ring-stone-400 focus:border-stone-400 outline-none text-gray-900">
            </div>

            <div>
                <label for="peso_kg" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Peso (Kg):</label>
                <input type="number" step="0.1" id="peso_kg" name="peso_kg" value="1.0" 
                       class="w-full rounded-lg border-gray-300 shadow-sm border p-3 focus:ring-2 focus:ring-stone-400 focus:border-stone-400 outline-none text-gray-900">
            </div>

            <div class="flex items-center bg-stone-100 p-3 rounded-lg border border-stone-200">
                <input type="checkbox" id="urgente" name="urgente" class="h-5 w-5 text-red-500 rounded border-gray-300 focus:ring-red-400">
                <label for="urgente" class="ml-3 text-sm font-semibold text-gray-800">¿Es un pedido urgente?</label>
            </div>

            <button type="submit" 
                    class="w-full bg-[#cd5c5c] hover:bg-[#b24c4c] text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200 text-lg uppercase tracking-wide">
                Crear Pedido ➔
            </button>
        </form>
    </div>
</body>
</html>
